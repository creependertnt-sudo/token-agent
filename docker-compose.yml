services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: token_agent
      POSTGRES_PASSWORD: token_agent
      POSTGRES_DB: token_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_agent -d token_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
